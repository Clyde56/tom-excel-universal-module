<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>汤姆EXCEL万能模块</title>
<style>
/* 汤姆EXCEL万能模块 — 样式表 */
:root {
  --bg: #f4f6fa; --surface: #ffffff; --surface-2: #f8fafc; --surface-3: #eef2f7;
  --text: #1f2937; --text-2: #64748b; --text-3: #94a3b8;
  --border: #e2e8f0; --border-2: #cbd5e1;
  --brand: #0f6cbd; --brand-2: #185abd; --brand-soft: #e8f1fb;
  --accent: #c2410c; --accent-2: #ea580c;
  --ok: #15803d; --ok-soft: #dcfce7;
  --warn: #b45309; --warn-soft: #fef3c7;
  --err: #b91c1c; --err-soft: #fee2e2;
  --r: #217346; /* Excel 绿 */
  --shadow: 0 1px 3px rgba(15,23,42,.08), 0 4px 12px rgba(15,23,42,.04);
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
}
[data-theme="dark"] {
  --bg: #0f1420; --surface: #171e2b; --surface-2: #1c2534; --surface-3: #232e40;
  --text: #e2e8f0; --text-2: #94a3b8; --text-3: #64748b;
  --border: #2b3749; --border-2: #3b4a60;
  --brand: #4aa3ff; --brand-2: #3b8ee8; --brand-soft: #152a44;
  --accent: #fb923c; --accent-2: #f97316;
  --ok: #4ade80; --ok-soft: #14321f; --warn: #fbbf24; --warn-soft: #3a2f12; --err: #f87171; --err-soft: #3a1a1a;
  --r: #2ea86a; --shadow: 0 1px 3px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
/* HTML hidden 属性必须压过组件自身的 display 规则，否则遮罩/提示会永远显示 */
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  background: var(--bg); color: var(--text); font-size: 13px; overflow: hidden;
}
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }

/* boot */
#boot-screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: var(--bg); z-index: 999; }
#boot-screen .boot-logo { font-size: 48px; }
#boot-screen strong { font-size: 20px; color: var(--brand); }
#boot-screen span { color: var(--text-2); }

.app-shell { display: flex; flex-direction: column; height: 100vh; }

/* topbar */
.topbar { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); box-shadow: var(--shadow); z-index: 5; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 210px; }
.brand-logo { width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(135deg,var(--brand),var(--brand-2)); display: grid; place-items: center; font-size: 22px; box-shadow: 0 2px 8px rgba(15,108,189,.3); }
.brand-text { display: flex; flex-direction: column; }
.brand-text .eyebrow { font-size: 9px; letter-spacing: 1px; color: var(--text-3); font-weight: 600; }
.brand-text h1 { margin: 1px 0 0; font-size: 16px; font-weight: 700; }
.workspace-switch { display: flex; background: var(--surface-3); border-radius: 8px; padding: 3px; gap: 2px; }
.ws-btn { border: 0; background: transparent; color: var(--text-2); padding: 6px 16px; border-radius: 6px; font-weight: 600; font-size: 12px; }
.ws-btn.active { background: var(--surface); color: var(--brand); box-shadow: var(--shadow); }
.topbar-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.icon-btn, .ghost-btn, .primary-btn, .mini-btn, .link-btn { border: 1px solid var(--border-2); background: var(--surface); color: var(--text); border-radius: 7px; padding: 7px 12px; font-size: 12px; font-weight: 500; transition: .15s; }
.icon-btn:hover, .ghost-btn:hover, .mini-btn:hover { background: var(--surface-3); }
.primary-btn { background: var(--brand); color: #fff; border-color: var(--brand); }
.primary-btn:hover { background: var(--brand-2); }
.primary-btn.accent { background: var(--accent); border-color: var(--accent); }
.primary-btn.accent:hover { background: var(--accent-2); }
.mini-btn { padding: 4px 9px; font-size: 11px; }
.link-btn { border: 0; background: transparent; color: var(--brand); padding: 4px 6px; }
.link-btn:hover { text-decoration: underline; }

/* file strip */
.file-strip { display: flex; align-items: center; gap: 10px; padding: 7px 16px; background: var(--surface-2); border-bottom: 1px solid var(--border); font-size: 12px; }
.fs-label { color: var(--text-3); font-weight: 600; }
.fs-file { color: var(--text); font-weight: 500; max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fs-status { padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; }
.fs-status.ok { background: var(--ok-soft); color: var(--ok); }
.fs-status.warn { background: var(--warn-soft); color: var(--warn); }
.fs-status.err { background: var(--err-soft); color: var(--err); }
.fs-meta { color: var(--text-2); }
.fs-spacer { flex: 1; }
.fs-hint { color: var(--text-3); font-size: 11px; }

/* workspace */
.workspace { flex: 1; display: flex; min-height: 0; padding: 10px; gap: 0; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; box-shadow: var(--shadow); }
.tree-panel { width: 300px; min-width: 180px; }
.inspector-panel { width: 330px; min-width: 240px; }
.center-column { flex: 1; display: flex; flex-direction: column; min-width: 0; gap: 10px; }
.splitter { width: 8px; cursor: col-resize; position: relative; }
.splitter::after { content: ''; position: absolute; left: 3px; top: 20%; height: 60%; width: 2px; background: var(--border-2); border-radius: 2px; }
.splitter:hover::after { background: var(--brand); }
.panel-header { display: flex; align-items: flex-start; justify-content: space-between; padding: 12px 14px 10px; border-bottom: 1px solid var(--border); }
.panel-header h2 { margin: 0; font-size: 13px; font-weight: 700; }
.panel-header p { margin: 2px 0 0; font-size: 11px; color: var(--text-3); }
.panel-actions { display: flex; gap: 4px; }
.panel-footer { display: flex; gap: 8px; padding: 8px 14px; border-top: 1px solid var(--border); }

/* tree */
.tree-toolbar { display: flex; gap: 6px; padding: 10px 12px; }
.search-input, .mini-select { flex: 1; min-width: 0; border: 1px solid var(--border-2); background: var(--surface-2); color: var(--text); border-radius: 6px; padding: 6px 8px; font-size: 12px; }
.mini-select { flex: 0 0 82px; }
.tree-list { flex: 1; overflow: auto; padding: 0 8px 10px; }
.tree-item { display: flex; align-items: center; gap: 5px; padding: 5px 6px; border-radius: 6px; cursor: pointer; user-select: none; font-size: 12px; }
.tree-item:hover { background: var(--surface-3); }
.tree-item.selected { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.tree-item .twisty { width: 14px; color: var(--text-3); font-size: 10px; text-align: center; }
.tree-item .ico { width: 16px; height: 16px; object-fit: contain; }
.tree-item .ico-ph { width: 16px; text-align: center; }
.tree-item .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-item .bind-dot { width: 7px; height: 7px; border-radius: 50%; }
.bind-dot.bound { background: var(--ok); }
.bind-dot.unbound { background: var(--border-2); }
.tree-item .badge-mini { font-size: 9px; color: var(--text-3); background: var(--surface-3); padding: 1px 5px; border-radius: 8px; }
.tree-item.depth-0 { font-weight: 600; }
.tree-item.depth-1 { padding-left: 20px; }
.tree-item.depth-2 { padding-left: 36px; }
.tree-item.depth-3 { padding-left: 52px; }
.ctx-menu { position: fixed; z-index: 200; background: var(--surface); border: 1px solid var(--border-2); border-radius: 8px; box-shadow: 0 8px 30px rgba(0,0,0,.18); padding: 4px; min-width: 150px; }
.ctx-menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: var(--text); padding: 7px 10px; border-radius: 5px; font-size: 12px; }
.ctx-menu button:hover { background: var(--surface-3); }
.ctx-menu button.danger { color: var(--err); }
.ctx-menu .sep { height: 1px; background: var(--border); margin: 4px 0; }

/* preview */
.preview-panel { flex: 1; min-height: 240px; }
#ribbon-preview { flex: 1; overflow: auto; padding: 14px; background: var(--surface-2); }
.office-mock { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; min-height: 100%; box-shadow: var(--shadow); }
.office-titlebar { height: 30px; background: var(--r); color: #fff; display: flex; align-items: center; padding: 0 12px; font-size: 11px; gap: 8px; }
.office-titlebar .qat { display: flex; gap: 4px; margin-left: auto; }
.office-titlebar .qat img { width: 15px; height: 15px; background: #fff; border-radius: 2px; }
.office-tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 8px; gap: 2px; }
.office-tab { padding: 8px 14px; font-size: 12px; color: var(--text-2); border-bottom: 2px solid transparent; cursor: default; }
.office-tab.file { color: var(--r); font-weight: 700; }
.office-tab.active { color: var(--r); font-weight: 600; border-bottom-color: var(--r); }
.office-ribbon { display: flex; padding: 8px 10px; gap: 4px; min-height: 96px; overflow-x: auto; }
.office-group { display: flex; flex-direction: column; border-right: 1px solid var(--border); padding: 0 10px; min-width: 80px; }
.office-group:last-child { border-right: 0; }
.office-group-body { display: flex; gap: 4px; flex: 1; align-items: flex-start; }
.office-group-label { text-align: center; font-size: 10px; color: var(--text-3); margin-top: 4px; }
.office-ctrl { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px 7px; border-radius: 5px; border: 1px solid transparent; min-width: 44px; cursor: pointer; }
.office-ctrl:hover, .office-ctrl.selected { background: var(--brand-soft); border-color: var(--brand); }
.office-ctrl.large { min-width: 60px; }
.office-ctrl img { width: 22px; height: 22px; object-fit: contain; }
.office-ctrl.large img { width: 32px; height: 32px; }
.office-ctrl .ico-ph { width: 22px; height: 22px; display: grid; place-items: center; color: var(--text-3); font-size: 14px; }
.office-ctrl .cl { font-size: 10px; text-align: center; max-width: 62px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.office-ctrl.sep { width: 1px; background: var(--border); padding: 0; margin: 4px 3px; min-width: 1px; }
.office-menu { position: relative; }
.menu-popover { position: absolute; top: 100%; left: 0; z-index: 50; background: var(--surface); border: 1px solid var(--border-2); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.15); padding: 5px; min-width: 170px; }
.menu-popover .mi { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 5px; font-size: 12px; }
.menu-popover .mi:hover { background: var(--surface-3); }
.menu-popover .mi img { width: 16px; height: 16px; }
.menu-popover .mi.sep { height: 1px; background: var(--border); padding: 0; margin: 4px 0; }

/* bottom */
.bottom-panel { height: 240px; min-height: 140px; }
.bottom-tabs { display: flex; align-items: center; gap: 2px; padding: 0 10px; border-bottom: 1px solid var(--border); }
.bottom-tab { border: 0; background: transparent; color: var(--text-2); padding: 10px 12px; font-size: 12px; font-weight: 600; border-bottom: 2px solid transparent; }
.bottom-tab.active { color: var(--brand); border-bottom-color: var(--brand); }
.badge { background: var(--surface-3); color: var(--text-2); border-radius: 8px; padding: 1px 6px; font-size: 10px; margin-left: 3px; }
.bottom-content { flex: 1; overflow: auto; padding: 12px 14px; }
.xml-code { font-family: var(--mono); font-size: 11px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; color: var(--text); margin: 0; }
.issue-row { display: flex; gap: 8px; padding: 7px 10px; border-radius: 6px; margin-bottom: 5px; font-size: 12px; align-items: flex-start; }
.issue-row.error { background: var(--err-soft); color: var(--err); }
.issue-row.warn { background: var(--warn-soft); color: var(--warn); }
.issue-row.info { background: var(--brand-soft); color: var(--brand); }
.issue-row .lv { font-weight: 700; flex: 0 0 40px; }
.issue-row .where { color: var(--text-2); font-size: 11px; }
.macro-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.macro-table th, .macro-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
.macro-table th { color: var(--text-3); font-size: 10px; text-transform: uppercase; }
.bound-tag { padding: 1px 7px; border-radius: 8px; font-size: 10px; }
.bound-tag.yes { background: var(--ok-soft); color: var(--ok); }
.bound-tag.no { background: var(--surface-3); color: var(--text-3); }
.empty-hint { color: var(--text-3); text-align: center; padding: 30px 10px; font-size: 12px; }

/* inspector */
.inspector-switch { display: flex; padding: 8px; gap: 4px; background: var(--surface-3); margin: 10px; border-radius: 8px; }
.inspector-tab { flex: 1; border: 0; background: transparent; color: var(--text-2); padding: 7px; border-radius: 6px; font-size: 12px; font-weight: 600; }
.inspector-tab.active { background: var(--surface); color: var(--brand); box-shadow: var(--shadow); }
.inspector-content { flex: 1; overflow: auto; padding: 4px 14px 14px; }
.inspector-title { font-size: 12px; font-weight: 700; margin: 6px 0 2px; }
.inspector-sub { font-size: 11px; color: var(--text-3); margin-bottom: 14px; }
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 11px; color: var(--text-2); margin-bottom: 4px; font-weight: 600; }
.form-group input, .form-group select, .form-group textarea { width: 100%; border: 1px solid var(--border-2); background: var(--surface-2); color: var(--text); border-radius: 6px; padding: 7px 9px; font-size: 12px; }
.form-group textarea { resize: vertical; min-height: 52px; }
.form-row { display: flex; gap: 8px; }
.form-row > * { flex: 1; }
.checkbox-row { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-2); margin-bottom: 8px; }
.checkbox-row input { width: auto; }
.icon-picker { display: flex; gap: 6px; align-items: center; }
.icon-picker img { width: 32px; height: 32px; border: 1px solid var(--border); border-radius: 5px; background: var(--surface-2); }
.section-divider { height: 1px; background: var(--border); margin: 16px 0; }
.hint-box { background: var(--brand-soft); color: var(--brand); padding: 9px 11px; border-radius: 6px; font-size: 11px; line-height: 1.5; }

/* AI */
.ai-chat { display: flex; flex-direction: column; height: 100%; gap: 10px; }
.ai-status { font-size: 11px; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; }
.ai-messages { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 8px; min-height: 120px; }
.ai-msg { padding: 8px 10px; border-radius: 8px; font-size: 12px; line-height: 1.55; max-width: 95%; }
.ai-msg.user { align-self: flex-end; background: var(--brand); color: #fff; }
.ai-msg.assistant { align-self: flex-start; background: var(--surface-3); color: var(--text); }
.ai-msg.system { align-self: center; background: transparent; color: var(--text-3); font-size: 11px; }
.ai-input-wrap { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--border); padding-top: 10px; }
.ai-input-wrap textarea { width: 100%; border: 1px solid var(--border-2); border-radius: 6px; padding: 8px; font-size: 12px; resize: vertical; min-height: 62px; background: var(--surface-2); color: var(--text); }
.ai-input-actions { display: flex; gap: 6px; }
.ai-input-actions .primary-btn { flex: 1; }
.ai-macro-chips { display: flex; flex-wrap: wrap; gap: 4px; max-height: 70px; overflow: auto; }
.macro-chip { font-size: 10px; background: var(--surface-3); border: 1px solid var(--border); border-radius: 10px; padding: 2px 7px; cursor: pointer; }
.macro-chip.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }

/* modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 300; display: grid; place-items: center; padding: 20px; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.25); width: min(560px, 100%); max-height: 86vh; overflow: auto; }
.modal.wide { width: min(820px, 100%); }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.modal-head h3 { margin: 0; font-size: 15px; }
.modal-head .close { border: 0; background: transparent; font-size: 20px; color: var(--text-3); }
.modal-body { padding: 18px 20px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); }
.icon-gallery { display: grid; grid-template-columns: repeat(auto-fill,minmax(52px,1fr)); gap: 6px; max-height: 45vh; overflow: auto; margin-top: 10px; }
.icon-cell { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 3px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
.icon-cell:hover { background: var(--brand-soft); border-color: var(--brand); }
.icon-cell img { width: 24px; height: 24px; }
.icon-cell span { font-size: 8px; color: var(--text-3); max-width: 48px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* toast / busy */
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: #1f2937; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 12px; z-index: 500; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.toast.ok { background: var(--ok); }
.toast.err { background: var(--err); }
.busy-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.35); z-index: 400; display: grid; place-items: center; }
.busy-card { background: var(--surface); border-radius: 12px; padding: 22px 30px; display: flex; flex-direction: column; align-items: center; gap: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.2); font-size: 13px; }
.spinner { width: 28px; height: 28px; border: 3px solid var(--border-2); border-top-color: var(--brand); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 6px; }
::-webkit-scrollbar-track { background: transparent; }

/* ============ 拖放移动 ============ */
.tree-item[draggable="true"], .office-ctrl[draggable="true"], .office-group[draggable="true"] { cursor: grab; }
.tree-item.dragging, .office-ctrl.dragging { opacity: .35; }
.drop-target { background: var(--brand-soft) !important; outline: 1px dashed var(--brand); }
.drop-before::before, .drop-after::after {
  content: ''; position: absolute; left: 4px; right: 4px; height: 2px; background: var(--brand); border-radius: 2px; z-index: 10;
}
.drop-before::before { top: 0; }
.drop-after::after { bottom: 0; }
.tree-item, .office-ctrl, .office-group, .office-tab { position: relative; }
.office-group.drop-target { outline: 2px dashed var(--brand); background: var(--brand-soft); }
.drag-hint { font-size: 10px; color: var(--brand); }

</style>
</head>
<body>
<div id="boot-screen">
  <div class="boot-logo">🦀</div>
  <strong>汤姆EXCEL万能模块</strong>
  <span>正在加载设计器...</span>
</div>

<div id="app" class="app-shell" hidden>
  <!-- 顶部栏 -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">🦀</div>
      <div class="brand-text">
        <span class="eyebrow">TOM EXCEL · RIBBON DESIGNER</span>
        <h1>汤姆EXCEL万能模块</h1>
      </div>
    </div>

    <div class="workspace-switch" role="group" aria-label="切换工作区">
      <button class="ws-btn active" data-ws="excel">Excel</button>
      <button class="ws-btn" data-ws="word">Word</button>
      <button class="ws-btn" data-ws="jsa">JS宏</button>
    </div>

    <div class="topbar-actions">
      <button id="btn-theme" class="icon-btn" title="切换深色/浅色">🌙</button>
      <button id="btn-reset" class="ghost-btn" title="重置为示例设计">重置示例</button>
      <button id="btn-settings" class="ghost-btn">⚙ AI 配置</button>
      <button id="btn-import" class="primary-btn">📂 导入工作簿</button>
      <button id="btn-save-xml" class="ghost-btn">💾 导出 XML</button>
      <button id="btn-save-workbook" class="primary-btn accent">⬇ 另存工作簿</button>
    </div>
  </header>

  <!-- 文件信息条 -->
  <div class="file-strip">
    <span class="fs-label">当前文件</span>
    <span id="fs-file" class="fs-file">尚未导入 · 使用内置示例设计</span>
    <span id="fs-status" class="fs-status ok">示例数据</span>
    <span id="fs-macro-count" class="fs-meta">宏 0 个</span>
    <span class="fs-spacer"></span>
    <span class="fs-hint">支持拖拽 .xlsm / .xlam / .docm 文件到窗口导入</span>
  </div>

  <!-- 三栏工作区 -->
  <main class="workspace">
    <!-- 左：结构树 -->
    <section class="panel tree-panel">
      <div class="panel-header">
        <div><h2>Ribbon 结构</h2><p>组织选项卡、分组与控件</p></div>
        <div class="panel-actions">
          <button id="btn-add-tab" class="mini-btn" title="新建选项卡">+ Tab</button>
        </div>
      </div>

let available = null;

function check() {
  if (available !== null) return available;
  try {
    const k = '__tom_test__';
    window.localStorage.setItem(k, '1');
    window.localStorage.removeItem(k);
    available = true;
  } catch {
    available = false;
  }
  return available;
}

function getItem(key) {
  if (check()) { try { return window.localStorage.getItem(key); } catch { /* fallthrough */ } }
  return mem.has(key) ? mem.get(key) : null;
}
function setItem(key, value) {
  mem.set(key, String(value));
  if (check()) { try { window.localStorage.setItem(key, String(value)); } catch { /* ignore */ } }
}
function removeItem(key) {
  mem.delete(key);
  if (check()) { try { window.localStorage.removeItem(key); } catch { /* ignore */ } }
}

/** 遍历所有控件（含 menu 子项），带回调 */
function walkControls(controls, cb, parent = null) {
  (controls || []).forEach((c, i) => {
    cb(c, i, controls, parent);
    if (c.items) walkControls(c.items, cb, c);
  });
}

/** 根据 id 查找控件，返回 {control, siblings, index, tab, group, parent} */
function findControl(ribbon, id) {
  let found = null;
  for (const tab of ribbon.tabs) {
    for (const group of tab.groups) {
      walkControls(group.controls, (c, i, siblings, parent) => {
        if (c.id === id) found = { control: c, siblings, index: i, tab, group, parent };
      });
    }
  }
  (ribbon.qat || []).forEach((c, i, arr) => {
    if (c.id === id) found = { control: c, siblings: arr, index: i, tab: null, group: null, parent: null, qat: true };
  });
  return found;
}

/* ============ 拖放移动（模型层） ============ */

/** 按 kind+id 在 Ribbon 树中定位任意节点，返回完整上下文 */
function locateNode(ribbon, kind, id) {
  if (kind === 'tab') {
    const i = ribbon.tabs.findIndex(t => t.id === id);
    return i < 0 ? null : { kind: 'tab', node: ribbon.tabs[i], siblings: ribbon.tabs, index: i };
  }
  if (kind === 'group') {
    for (const tab of ribbon.tabs) {
      const i = tab.groups.findIndex(g => g.id === id);
      if (i >= 0) return { kind: 'group', node: tab.groups[i], siblings: tab.groups, index: i, tab };
    }
    return null;
  }
  if (kind === 'control') {
    const f = findControl(ribbon, id);
    if (!f) return null;
    return {
      kind: 'control', node: f.control, siblings: f.siblings, index: f.index,
      tab: f.tab, group: f.group, parent: f.parent, qat: f.qat,
    };
  }
  return null;
}

/** 判断 node 的子树里是否含有 id（用于防止把节点拖进自己的后代） */
function containsId(node, id) {
  if (node.id === id) return true;
  for (const c of node.items || []) if (containsId(c, id)) return true;
  return false;
}

/**
 * 把来源节点移动到目标位置。
 * 参数均为 {kind, id}，position 为 'before' | 'after' | 'inside'。
 * 返回 {ok, message}。
 *
 * 合法组合：
 *   tab    -> tab(before/after)
 *   group  -> group(before/after) | tab(inside)
 *   control-> control(before/after) | group(inside) | menu(inside，成为子项) | qat(inside)
 */
function moveNodeTo(ribbon, src, dst, position = 'after') {
  if (!src || !dst) return { ok: false, message: '无效的拖放对象' };
  if (src.kind === dst.kind && src.id === dst.id) return { ok: false, message: '不能拖到自己身上' };

  const from = locateNode(ribbon, src.kind, src.id);
  const to = locateNode(ribbon, dst.kind, dst.id);
  if (!from || !to) return { ok: false, message: '节点不存在' };

  // 防止把节点拖入自己的子树
  if (src.kind === 'control' && dst.kind === 'control' && containsId(from.node, dst.id)) {
    return { ok: false, message: '不能把控件拖入它自己的子项' };
  }
  if (src.kind === 'group' && dst.kind === 'group' && from.node.id === to.node.id) {
    return { ok: false, message: '不能拖到自己身上' };
  }

  let targetList, targetIndex;

  // ---- Tab ----
  if (src.kind === 'tab') {
    if (dst.kind !== 'tab') return { ok: false, message: '选项卡只能在选项卡之间排序' };
    targetList = ribbon.tabs;
    const di = ribbon.tabs.findIndex(t => t.id === dst.id);
    targetIndex = position === 'before' ? di : di + 1;
    from.siblings.splice(from.index, 1);
    if (targetIndex > from.index) targetIndex--;
    ribbon.tabs.splice(targetIndex, 0, from.node);
    return { ok: true, message: '已移动选项卡' };
  }

  // ---- Group ----
  if (src.kind === 'group') {
    if (dst.kind === 'tab') {
      const tab = to.node;
      from.siblings.splice(from.index, 1);
      tab.groups.push(from.node);
      return { ok: true, message: `已把分组移入「${tab.label}」` };
    }
    if (dst.kind === 'group') {
      if (position === 'inside') return { ok: false, message: '分组不能嵌套在分组里' };
      targetList = to.siblings;
      const di = to.siblings.findIndex(g => g.id === dst.id);
      targetIndex = position === 'before' ? di : di + 1;
      if (from.siblings === to.siblings) {
        from.siblings.splice(from.index, 1);
        if (targetIndex > from.index) targetIndex--;
      } else {
        from.siblings.splice(from.index, 1);
      }
      targetList.splice(targetIndex, 0, from.node);
      return { ok: true, message: '已移动分组' };
    }
    return { ok: false, message: '分组只能拖到其他分组或选项卡中' };
  }

  // ---- Control ----
  if (src.kind === 'control') {
    if (dst.kind === 'tab') return { ok: false, message: '请把控件拖到分组或菜单里' };
    if (dst.kind === 'group') {
      const group = to.node;
      from.siblings.splice(from.index, 1);
      group.controls.push(from.node);
      return { ok: true, message: `已把控件移入「${group.label}」` };
    }
    if (dst.kind === 'control') {
      const dstCtl = to.node;
      // 拖入 menu 内部成为子项
      if (position === 'inside' && dstCtl.type === 'menu') {
        from.siblings.splice(from.index, 1);
        dstCtl.items = dstCtl.items || [];
        dstCtl.items.push(from.node);
        return { ok: true, message: `已把控件移入菜单「${dstCtl.label}」` };
      }
      // 普通排序：before / after
      const usePosition = (position === 'inside') ? 'after' : position;
      targetList = to.siblings;
      const di = to.siblings.findIndex(c => c.id === dst.id);
      targetIndex = usePosition === 'before' ? di : di + 1;
      if (from.siblings === to.siblings) {
        from.siblings.splice(from.index, 1);
        if (targetIndex > from.index) targetIndex--;
      } else {
        from.siblings.splice(from.index, 1);
      }
      targetList.splice(targetIndex, 0, from.node);
      return { ok: true, message: '已移动控件' };
    }
  }

  return { ok: false, message: '不支持这种拖放组合' };
}

/** 判断某种拖放组合是否合法（用于拖拽时给出视觉提示） */
function canDrop(src, dst) {
  if (!src || !dst) return false;
  if (src.kind === dst.kind && src.id === dst.id) return false;
  const pairs = {
    tab: ['tab'],
    group: ['group', 'tab'],
    control: ['control', 'group', 'tab'], // tab 仅用于位置提示，实际细查在 moveNodeTo
  };
  return (pairs[src.kind] || []).includes(dst.kind);
}


/* ===== xml.js ===== */
/**
 * 汤姆EXCEL万能模块 — XML 序列化 / 解析 / 校验
 * 负责 Ribbon 树 <-> customUI14.xml（Office RibbonX schema）的可逆转换。
 */


function escapeXml(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&apos;');
}

function attrs(c) {
  let a = `id="${escapeXml(c.id)}"`;
  if (c.label !== undefined) a += ` label="${escapeXml(c.label)}"`;
  if (c.imageMso) a += ` imageMso="${escapeXml(c.imageMso)}"`;
  if (c.size === 'large') a += ' size="large"';
  if (c.onAction) a += ` onAction="${escapeXml(c.onAction)}"`;
  if (c.onChange) a += ` onChange="${escapeXml(c.onChange)}"`;
  if (c.screentip) a += ` screentip="${escapeXml(c.screentip)}"`;
  if (c.supertip) a += ` supertip="${escapeXml(c.supertip)}"`;
  if (c.visible === false) a += ' visible="false"';
  if (c.enabled === false) a += ' enabled="false"';
  if (c.description) a += ` description="${escapeXml(c.description)}"`;
  if (c.tag) a += ` tag="${escapeXml(c.tag)}"`;
  return a;
}

function controlToXml(c, indent) {
  const pad = ' '.repeat(indent);
  const voidTypes = ['separator', 'labelControl'];
  if (c.type === 'separator') return `${pad}<separator />`;
  if (voidTypes.includes(c.type)) return `${pad}<labelControl ${attrs(c)} />`;

  if (c.type === 'menu') {
    let s = `${pad}<menu ${attrs(c)}>\n`;
    (c.items || []).forEach(it => { s += controlToXml(it, indent + 2) + '\n'; });
    s += `${pad}</menu>`;
    return s;
  }
  if (c.type === 'gallery') {
    let s = `${pad}<gallery ${attrs(c)}>\n`;
    s += `${pad}  <itemGallery id="${escapeXml(c.id + 'Gallery')}" label="${escapeXml(c.label)}" />\n`;
    s += `${pad}</gallery>`;
    return s;
  }
  if (c.type === 'comboBox') {
    let s = `${pad}<comboBox ${attrs(c)}>\n`;
    (c.items || []).forEach(it => { s += `${pad}  <item id="${escapeXml(it.id || uid('itm'))}" label="${escapeXml(it.label)}" />\n`; });
    s += `${pad}</comboBox>`;
    return s;
  }
  const tag = ['toggleButton','checkBox','editBox','dropDown'].includes(c.type) ? c.type : 'button';
  return `${pad}<${tag} ${attrs(c)} />`;
}

/** 生成 customUI14.xml */
function buildRibbonXml(ribbon) {
  let s = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  s += '<customUI xmlns="http://schemas.microsoft.com/office/2009/07/customui">\n';
  s += `  <ribbon startFromScratch="${ribbon.startFromScratch ? 'true' : 'false'}">\n`;
  if (ribbon.qat && ribbon.qat.length) {
    s += '    <qat>\n';
    ribbon.qat.forEach(c => { s += controlToXml(c, 6) + '\n'; });
    s += '    </qat>\n';
  }
  s += '    <tabs>\n';
  ribbon.tabs.forEach(tab => {
    s += `      <tab id="${escapeXml(tab.id)}" label="${escapeXml(tab.label)}">\n`;
    tab.groups.forEach(group => {
      s += `        <group id="${escapeXml(group.id)}" label="${escapeXml(group.label)}">\n`;
      group.controls.forEach(c => { s += controlToXml(c, 10) + '\n'; });
      s += '        </group>\n';
    });
    s += '      </tab>\n';
  });
  s += '    </tabs>\n';
  s += '  </ribbon>\n';
  s += '</customUI>\n';
  return s;
}

/** 从 XML 文本解析回 Ribbon 树（尽力而为，尽量保留可读属性） */
function parseRibbonXml(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const err = doc.querySelector('parsererror');
  if (err) throw new Error('XML 解析失败：' + err.textContent.slice(0, 200));
  const ribbonEl = doc.getElementsByTagName('ribbon')[0];
  if (!ribbonEl) throw new Error('未找到 <ribbon> 节点');
  const ribbon = {
    startFromScratch: ribbonEl.getAttribute('startFromScratch') === 'true',
    tabs: [], qat: [],
  };
  const local = el => el.localName || el.nodeName.replace(/^.*:/, '');
  const readAttrs = el => {
    const c = {};
    for (const a of Array.from(el.attributes)) c[a.name] = a.value;
    return c;
  };
  const nodeToControl = el => {
    const tag = local(el);
    if (tag === 'separator') return { type: 'separator', id: el.getAttribute('id') || uid('sep') };
    const raw = readAttrs(el);
    const c = {
      type: ['button','toggleButton','checkBox','editBox','comboBox','dropDown','gallery','menu','labelControl'].includes(tag) ? tag : 'button',
      id: raw.id || uid('ctrl'), label: raw.label || '', imageMso: raw.imageMso || '',
      size: raw.size || 'normal', onAction: raw.onAction || '', onChange: raw.onChange || '',
      screentip: raw.screentip || '', supertip: raw.supertip || '',
      visible: raw.visible !== 'false', enabled: raw.enabled !== 'false',
    };
    if (tag === 'menu' || tag === 'comboBox') {
      c.items = Array.from(el.children).map(ch => nodeToControl(ch)).filter(Boolean);
    }
    return c;
  };
  Array.from(ribbonEl.children).forEach(child => {
    if (local(child) === 'qat') {
      ribbon.qat = Array.from(child.children).map(nodeToControl);
    }
    if (local(child) === 'tabs') {
      Array.from(child.children).forEach(tabEl => {
        if (local(tabEl) !== 'tab') return;
        const tab = { id: tabEl.getAttribute('id') || uid('tab'), label: tabEl.getAttribute('label') || '选项卡', groups: [] };
        Array.from(tabEl.children).forEach(gEl => {
          if (local(gEl) !== 'group') return;
          const group = { id: gEl.getAttribute('id') || uid('grp'), label: gEl.getAttribute('label') || '分组', controls: [] };
          group.controls = Array.from(gEl.children).map(nodeToControl);
          tab.groups.push(group);
        });
        ribbon.tabs.push(tab);
      });
    }
  });
  return ribbon;
}

/** 校验 Ribbon 结构，返回 issue 列表 */
function validateRibbon(ribbon) {
  const issues = [];
  const ids = new Map();
  const checkId = (c, where) => {
    if (!c.id) issues.push({ level: 'error', where, msg: '控件缺少 id' });
    else if (ids.has(c.id)) issues.push({ level: 'error', where, msg: `id 重复：「${c.id}」已用于 ${ids.get(c.id)}` });
    else ids.set(c.id, where);
    if (!/^[A-Za-z][A-Za-z0-9_]*$/.test(c.id || '')) {
      issues.push({ level: 'error', where, msg: `id「${c.id}」不合法（须以字母开头，仅含字母数字下划线）` });
    }
    if (!['separator','labelControl'].includes(c.type) && !c.label) {
      issues.push({ level: 'warn', where, msg: '控件缺少 label 显示名称' });
    }
  };
  ribbon.tabs.forEach((tab, ti) => {
    const tw = `选项卡 ${ti + 1}「${tab.label}」`;
    checkId(tab, tw);
    if (!tab.label) issues.push({ level: 'error', where: tw, msg: '选项卡缺少 label' });
    if (!tab.groups.length) issues.push({ level: 'warn', where: tw, msg: '选项卡下没有分组' });
    tab.groups.forEach((g, gi) => {
      const gw = `${tw} / 分组 ${gi + 1}「${g.label}」`;
      checkId(g, gw);
      if (!g.label) issues.push({ level: 'warn', where: gw, msg: '分组缺少 label' });
      if (!g.controls.length) issues.push({ level: 'warn', where: gw, msg: '分组下没有控件' });
      const walk = (list) => list.forEach(c => {
        checkId(c, `${gw} / ${c.label || c.type}`);
        if (c.type === 'menu' && (!c.items || c.items.length < 2)) {
          issues.push({ level: 'warn', where: `${gw} / 菜单「${c.label}」`, msg: '菜单建议至少包含 2 个子项' });
        }
        if (['button','toggleButton','checkBox'].includes(c.type) && !c.onAction && !c.onChange) {
          issues.push({ level: 'info', where: `${gw} / ${c.label}`, msg: '按钮未绑定宏 onAction' });
        }
        if (c.items) walk(c.items);
      });
      walk(g.controls);
    });
  });
  (ribbon.qat || []).forEach((c, i) => checkId(c, `快速访问工具栏 ${i + 1}`));
  return issues;
}

/** 计算绑定统计 */
function bindingStats(ribbon, macros) {
  const boundIds = new Set();
  const collect = list => (list || []).forEach(c => { if (c.onAction) boundIds.add(c.onAction); if (c.items) collect(c.items); });
  ribbon.tabs.forEach(t => t.groups.forEach(g => collect(g.controls)));
  collect(ribbon.qat);
  const macroNames = new Set(macros.map(m => `${m.module}.${m.name}`));
  let bound = 0, unbound = 0;
  macros.forEach(m => (boundIds.has(`${m.module}.${m.name}`) ? bound++ : unbound++));
  return { bound, unbound, total: macros.length };
}


/* ===== zip.js ===== */
/**
 * 汤姆EXCEL万能模块 — 零依赖 ZIP 读写（基于浏览器原生 CompressionStream）
 * xlsm/xlam/docm 本质是 ZIP 容器，这里实现最小可用的 ZIP 解析与打包，
 * 用于读取 customUI.xml / 提取宏列表，以及把编辑后的 Ribbon 写回另存。
 */

const enc = new TextEncoder();
const dec = new TextDecoder();

function crc32(buf) {
  let c, crc = 0xFFFFFFFF;
  const table = crc32.table || (crc32.table = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })());
  for (let i = 0; i < buf.length; i++) crc = table[(crc ^ buf[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function u16(a, o) { return a[o] | (a[o + 1] << 8); }
function u32(a, o) { return (a[o] | (a[o + 1] << 8) | (a[o + 2] << 16) | (a[o + 3] << 24)) >>> 0; }
function set16(a, o, v) { a[o] = v & 0xff; a[o + 1] = (v >>> 8) & 0xff; }
function set32(a, o, v) { a[o] = v & 0xff; a[o + 1] = (v >>> 8) & 0xff; a[o + 2] = (v >>> 16) & 0xff; a[o + 3] = (v >>> 24) & 0xff; }

/** 解压 deflate-raw 数据 */
async function inflateRaw(bytes) {
  if (typeof DecompressionStream === 'undefined') throw new Error('当前浏览器不支持 DecompressionStream，请使用新版 Chrome/Edge');
  const ds = new DecompressionStream('deflate-raw');
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

/** 解压 deflate（带 zlib 头） */
async function inflateZlib(bytes) {
  const ds = new DecompressionStream('deflate');
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

/** 解压单个 ZIP entry 的原始数据 */
async function decompressEntry(entry, zipBytes) {
  const raw = zipBytes.slice(entry.dataOffset, entry.dataOffset + entry.compressedSize);
  if (entry.method === 0) return raw;
  if (entry.method === 8) {
    try { return await inflateRaw(raw); }
    catch {
      try { return await inflateZlib(raw); }
      catch (e) { throw new Error(`解压 ${entry.name} 失败：${e.message}`); }
    }
  }
  throw new Error(`不支持的 ZIP 压缩方法 ${entry.method}（${entry.name}）`);
}

/**
 * 解析 ZIP，返回 entries 数组。每个 entry: {name, method, compressedSize, size, dataOffset, crc}
 */
async function readZip(arrayBuffer) {
  const bytes = new Uint8Array(arrayBuffer);
  // 找 EOCD（End of Central Directory）
  let eocd = -1;
  const min = Math.max(0, bytes.length - 22 - 65535);
  for (let i = bytes.length - 22; i >= min; i--) {
    if (u32(bytes, i) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('不是有效的 ZIP/xlsm 文件（未找到 EOCD）');
  const totalEntries = u16(bytes, eocd + 10);
  let cdOffset = u32(bytes, eocd + 16);
  // Zip64 兜底：若 EOCD 值为 0xFFFFFFFF，读 Zip64 EOCD locator
  if (cdOffset === 0xFFFFFFFF) {
    const z64 = u32(bytes, eocd - 20); // 粗略定位 zip64 eocd
    // 常规 locator 在 eocd-20，zip64 eocd offset 在 locator+8
    const loc = eocd - 20;
    if (u32(bytes, loc) === 0x07064b50) {
      const z64off = u32(bytes, loc + 8);
      cdOffset = u32(bytes, z64off + 48);
    }
  }
  const entries = [];
  let p = cdOffset;
  for (let i = 0; i < totalEntries; i++) {
    if (u32(bytes, p) !== 0x02014b50) break;
    const method = u16(bytes, p + 10);
    const compressedSize = u32(bytes, p + 20);
    const size = u32(bytes, p + 24);
    const nameLen = u16(bytes, p + 28);
    const extraLen = u16(bytes, p + 30);
    const commentLen = u16(bytes, p + 32);
    const localOffset = u32(bytes, p + 42);
    const name = dec.decode(bytes.slice(p + 46, p + 46 + nameLen));
    // 读 local header 拿数据真实起点
    const lhNameLen = u16(bytes, localOffset + 26);
    const lhExtraLen = u16(bytes, localOffset + 28);
    const dataOffset = localOffset + 30 + lhNameLen + lhExtraLen;
    entries.push({ name, method, compressedSize, size, dataOffset, crc: u32(bytes, p + 16) });
    p += 46 + nameLen + extraLen + commentLen;
  }
  return { bytes, entries };
}

/** 读取 entry 为文本 */
async function readZipText(zip, name) {
  const e = zip.entries.find(x => x.name === name);
  if (!e) return null;
  const data = await decompressEntry(e, zip.bytes);
  return dec.decode(data);
}

/** 读取 entry 为 Uint8Array */
async function readZipBytes(zip, name) {
  const e = zip.entries.find(x => x.name === name);
  if (!e) return null;
  return decompressEntry(e, zip.bytes);
}

/** 列出所有 entry 名称 */
function listZipNames(zip) { return zip.entries.map(e => e.name); }

/**
 * 写 ZIP：把 entries [{name, data:Uint8Array}] 打包成 ArrayBuffer。
 * 使用 deflate-raw 压缩（与 xlsm 常规一致），无外部依赖。
 */
async function writeZip(entries) {
  const locals = [];
  const centrals = [];
  let offset = 0;
  for (const e of entries) {
    const nameBytes = enc.encode(e.name);
    const data = e.data instanceof Uint8Array ? e.data : enc.encode(String(e.data ?? ''));
    const useDeflate = e.store !== true && data.length > 0;
    let compData;
    if (useDeflate) {
      const cs = new CompressionStream('deflate-raw');
      const stream = new Blob([data]).stream().pipeThrough(cs);
      compData = new Uint8Array(await new Response(stream).arrayBuffer());
    } else {
      compData = data;
    }
    const method = useDeflate ? 8 : 0;
    const crc = crc32(data);

    // Local file header
    const lh = new Uint8Array(30 + nameBytes.length);
    set32(lh, 0, 0x04034b50);
    set16(lh, 4, 20);
    set16(lh, 6, 0);
    set16(lh, 8, method);
    set16(lh, 10, 0); set16(lh, 12, 0); // time/date
    set32(lh, 14, crc);
    set32(lh, 18, compData.length);
    set32(lh, 22, data.length);
    set16(lh, 26, nameBytes.length);
    set16(lh, 28, 0);
    lh.set(nameBytes, 30);
    locals.push(lh, compData);

    // Central directory
    const cd = new Uint8Array(46 + nameBytes.length);
    set32(cd, 0, 0x02014b50);
    set16(cd, 4, 20); set16(cd, 6, 20);
    set16(cd, 8, 0); set16(cd, 10, method);
    set16(cd, 12, 0); set16(cd, 14, 0);
    set32(cd, 16, crc);
    set32(cd, 20, compData.length);
    set32(cd, 24, data.length);
    set16(cd, 28, nameBytes.length);
    set16(cd, 30, 0); set16(cd, 32, 0);
    set16(cd, 34, 0); set16(cd, 36, 0);
    set32(cd, 38, 0);
    set32(cd, 42, offset);
    cd.set(nameBytes, 46);
    centrals.push(cd);

    offset += lh.length + compData.length;
  }
  const cdSize = centrals.reduce((s, c) => s + c.length, 0);
  const eocd = new Uint8Array(22);
  set32(eocd, 0, 0x06054b50);
  set16(eocd, 4, 0); set16(eocd, 6, 0);
  set16(eocd, 8, entries.length); set16(eocd, 10, entries.length);
  set32(eocd, 12, cdSize);
  set32(eocd, 16, offset);
  set16(eocd, 20, 0);

  const total = offset + cdSize + 22;
  const out = new Uint8Array(total);
  let pos = 0;
  for (const part of [...locals, ...centrals, eocd]) { out.set(part, pos); pos += part.length; }
  return out.buffer;
}

/** 把 Ribbon XML 写入已有 xlsm 的副本，返回新的 ArrayBuffer */
async function injectRibbonIntoXlsm(originalBuffer, ribbonXml, {
  customUiEntry = 'customUI/customUI14.xml',
  relsEntry = 'customUI/_rels/customUI14.xml.rels',
} = {}) {
  const zip = await readZip(originalBuffer);
  const results = [];
  let hasRel = false;
  for (const e of zip.entries) {
    if (e.name === customUiEntry) {
      results.push({ name: e.name, data: enc.encode(ribbonXml) });
      continue;
    }
    if (e.name === relsEntry) hasRel = true;
    // 其余条目原样复制（解压再重压，保持内容一致）
    const data = await decompressEntry(e, zip.bytes);
    results.push({ name: e.name, data });
  }
  if (!zip.entries.some(e => e.name === customUiEntry)) {
    results.push({ name: customUiEntry, data: enc.encode(ribbonXml) });
  }
  if (!hasRel) {
    results.push({
      name: relsEntry,
      data: enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.microsoft.com/office/2006/relationships/ui/extensibility" Target="customUI14.xml" /></Relationships>'),
    });
  }
  return writeZip(results);
}

/** 触发浏览器下载 */
function downloadBlob(buffer, filename, mime = 'application/octet-stream') {
  const blob = new Blob([buffer], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}


/* ===== workbook.js ===== */
/**
 * 汤姆EXCEL万能模块 — 工作簿检查层
 * 从 xlsm/xlam 中提取：现有 Ribbon XML、VBA/JSA 宏过程列表。
 * VBA 项目为 OLE 复合文档且源码经 MS-OVBA 压缩，这里用启发式扫描
 * 提取可读过程名；若无法解析，则以 Ribbon onAction 作为绑定来源兜底。
 */



function detectKind(name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  if (['docm', 'dotm'].includes(ext)) return 'word';
  return 'excel';
}

/** 从字节中启发式扫描 VBA 过程名 Sub/Function */
function scanVbaProcedures(bytes) {
  const text = new TextDecoder('latin1').decode(bytes);
  const out = new Set();
  // MS-OVBA 压缩流里过程名常以压缩形式出现，但仍可匹配到部分明文/近似明文
  const re = /(?:Public\s+|Private\s+|Friend\s+|Static\s+)*(?:Sub|Function)\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(/g;
  let m;
  while ((m = re.exec(text)) && out.size < 500) out.add(m[1]);
  return [...out];
}

/** 从 JSA 的 JDEData.bin 提取函数名 */
function scanJsaProcedures(bytes) {
  const text = new TextDecoder('utf-8').decode(bytes);
  const out = new Set();
  const re = /function\s+([A-Za-z_$][A-Za-z0-9_$]*)\s*\(/g;
  let m;
  while ((m = re.exec(text)) && out.size < 500) out.add(m[1]);
  return [...out];
}

/**
 * 检查工作簿，返回统一结构：
 * { name, extension, kind, customUiXml, ribbon, macros:[{module,name,signature,scope,kind,bound}], warnings:[] }
 */
async function inspectWorkbook(file) {
  const buf = await file.arrayBuffer();
  const zip = await readZip(buf);
  const names = listZipNames(zip);
  const kind = detectKind(file.name);

  // 现有 Ribbon
  let customUiXml = null;
  customUiXml = await readZipText(zip, 'customUI/customUI14.xml');
  if (!customUiXml) customUiXml = await readZipText(zip, 'customUI/customUI.xml');

  // 宏列表
  const warnings = [];
  const macros = [];
  const vbaEntry = kind === 'word' ? 'word/vbaProject.bin' : 'xl/vbaProject.bin';
  const jsaEntry = kind === 'word' ? 'word/JDEData.bin' : 'xl/JDEData.bin';
  let foundNames = [];

  if (names.includes(vbaEntry)) {
    const vbaBytes = await readZipBytes(zip, vbaEntry);
    foundNames = scanVbaProcedures(vbaBytes);
    if (!foundNames.length) warnings.push('VBA 工程已加密或过程名为压缩存储，未能自动解析；已根据现有 Ribbon 绑定生成宏清单，可手动补充。');
  } else {
    const jsaBytes = await readZipBytes(zip, jsaEntry);
    if (jsaBytes) foundNames = scanJsaProcedures(jsaBytes);
    if (!foundNames.length) warnings.push('未在文件中发现可解析的宏过程，可在左侧宏面板手动添加。');
  }

  // 从已有 Ribbon onAction 里补充绑定过程
  const boundActions = new Set();
  let ribbon = null;
  if (customUiXml) {
    try {
      ribbon = parseRibbonXml(customUiXml);
      const collect = list => (list || []).forEach(c => {
        if (c.onAction) boundActions.add(c.onAction);
        if (c.items) collect(c.items);
      });
      ribbon.tabs.forEach(t => t.groups.forEach(g => collect(g.controls)));
      collect(ribbon.qat);
    } catch (e) { warnings.push('现有 Ribbon XML 解析失败：' + e.message); }
  }
  boundActions.forEach(a => {
    const parts = a.split('.');
    const name = parts.pop();
    const module = parts.join('.') || 'Module1';
    if (!foundNames.includes(name)) foundNames.push(name);
  });

  // 归类到模块
  foundNames.forEach((n, i) => {
    const fromBinding = [...boundActions].find(a => a.split('.').pop() === n);
    const module = fromBinding ? fromBinding.split('.').slice(0, -1).join('.') || 'Module1' : 'Module' + (Math.floor(i / 8) + 1);
    macros.push({
      module, name: n,
      signature: `${module}.${n}()`,
      scope: 'public', kind: 'Sub',
      bound: fromBinding ? (fromBinding) : '',
    });
  });

  return {
    name: file.name,
    extension: file.name.split('.').pop().toLowerCase(),
    kind,
    customUiXml,
    ribbon,
    macros,
    warnings,
    originalBuffer: buf,
    zipNames: names,
  };
}

/** 共享设计准则（改写自原应用，品牌改为汤姆EXCEL万能模块） */
function designGuidelines() {
  return [
    '设计目标：像资深 Office 产品设计师一样规划 Ribbon，而不是按宏清单机械铺按钮。',

    '默认只创建 1 个自定义选项卡，把不同任务阶段拆成多个逻辑分组；只有用户明确要求多个选项卡时才创建多个。',
    '分组代表任务阶段或对象类别，例如导入、清洗、分析、格式、输出、维护，禁止使用「功能1/其他」这类弱分组。',
    '每个分组建议 2-5 个直接可见控件；超过 5 个相关动作时应使用 menu 收纳低频项。',

    '控件顺序遵循工作流：准备/导入 → 处理/计算 → 审核/预览 → 输出/维护。',
    'Label 要短、可执行、面向用户，不要照搬英文宏名；screentip 说明动作，supertip 说明结果与注意事项。',
    '所有面向用户的中文文本不要以句号结尾，尽量不用句号分隔。',
    '只能绑定 macros 中真实存在的宏，targetMacroName 必须逐字等于宏 name，targetMacroModule 必须等于宏 module。',
    'output 只返回 JSON，不要 Markdown 代码块或解释性散文。',
  ].map((x, i) => `${i + 1}. ${x}`).join('\n');
}

function buildPlanPrompt(userRequest, macros, availableImageMsos, applyMode = 'replace') {
  const system = [
    '你是「汤姆EXCEL万能模块」内置的 Office Ribbon 信息架构设计助手。',
    designGuidelines(),
    '根据宏列表规划 tab、group、control、按钮名称、imageMso 与宏绑定。',
    '返回格式：{"summary":string,"tabs":[{"label":string,"groups":[{"label":string,"controls":[{"type":"button","label":string,"imageMso":string,"size":"large|normal","onAction":"模块.过程名","screentip":string,"supertip":string}]}]}]}',
    'applyMode=replace 时重新规划整套 Ribbon；append 时只追加；modify 时基于 currentRibbon 做最小改动。',
  ].join('\n');
  const user = JSON.stringify({
    userRequest, applyMode,
    macros: macros.map(m => ({ module: m.module, name: m.name })),
    availableImageMsos: availableImageMsos.slice(0, 200),
  });
  return { system, user };
}

function endpointOf(baseUrl) {
  const b = (baseUrl || '').replace(/\/+$/, '');
  return b.endsWith('/chat/completions') ? b : `${b}/chat/completions`;
}

function headers(settings) {
  return { 'Content-Type': 'application/json', Authorization: `Bearer ${settings.apiKey}` };
}

/** 连通性测试 */
async function testConnection(settings) {
  const controller = new AbortController();
  const t = setTimeout(() => controller.abort(), 15000);
  try {
    const res = await fetch(endpointOf(settings.baseUrl), {
      method: 'POST', headers: headers(settings), signal: controller.signal,
      body: JSON.stringify({ model: settings.model, messages: [{ role: 'user', content: 'ping' }], max_tokens: 8, temperature: 0 }),
    });
    const text = await res.text();
    return { ok: res.ok, status: res.status, message: res.ok ? '连接成功' : text.slice(0, 200) };
  } catch (e) {
    return { ok: false, status: 0, message: e.name === 'AbortError' ? '连接超时' : (e.message || '连接失败') };
  } finally { clearTimeout(t); }
}

/** 非流式规划，返回 {summary, tabs} */
async function planRibbon(settings, userRequest, macros, imageMsos, applyMode = 'replace') {
  const { system, user } = buildPlanPrompt(userRequest, macros, imageMsos, applyMode);
  let body = {
    model: settings.model, temperature: 0.2,
    messages: [{ role: 'system', content: system }, { role: 'user', content: user }],
    response_format: { type: 'json_object' },
  };
  if (/^deepseek-v\d/i.test(settings.model)) body.thinking = { type: 'disabled' };
  let res = await fetch(endpointOf(settings.baseUrl), { method: 'POST', headers: headers(settings), body: JSON.stringify(body) });
  if (res.status === 400) {
    delete body.response_format;
    res = await fetch(endpointOf(settings.baseUrl), { method: 'POST', headers: headers(settings), body: JSON.stringify(body) });
  }
  if (!res.ok) throw new Error(`AI 请求失败 ${res.status}: ${(await res.text()).slice(0, 200)}`);
  const json = await res.json();
  const content = json.choices?.[0]?.message?.content || '';
  return parsePlan(content);
}

function parsePlan(text) {
  let clean = String(text).trim();
  clean = clean.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  const s = clean.indexOf('{'), e = clean.lastIndexOf('}');
  if (s < 0 || e < 0) throw new Error('AI 未返回有效 JSON 方案');
  const obj = JSON.parse(clean.slice(s, e + 1));
  if (!Array.isArray(obj.tabs)) throw new Error('AI 方案缺少 tabs 数组');
  return obj;
}

/** 流式规划：逐行回调 onDelta(text) / onOperation(op)，返回完整文本 */
async function planRibbonStream(settings, userRequest, macros, imageMsos, applyMode, onDelta, signal) {
  const { system, user } = buildPlanPrompt(userRequest, macros, imageMsos, applyMode);
  const streamSystem = system + '\n请用 NDJSON 输出：每行一个完整 JSON 操作对象。操作类型 insertControl/insertControls/createTab/createGroup/message/finish。优先用 createTab、createGroup、insertControls 一次插入多个控件，最后输出 {"type":"finish","summary":"..."}。';
  const body = {
    model: settings.model, temperature: 0.2, stream: true,
    messages: [{ role: 'system', content: streamSystem }, { role: 'user', content: user }],
  };
  if (/^deepseek-v\d/i.test(settings.model)) body.thinking = { type: 'disabled' };
  const res = await fetch(endpointOf(settings.baseUrl), { method: 'POST', headers: headers(settings), body: JSON.stringify(body), signal });
  if (!res.ok || !res.body) throw new Error(`AI 流式请求失败 ${res.status}`);
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '', full = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();
    for (const line of lines) {
      if (!line.startsWith('data:')) continue;
      const data = line.slice(5).trim();
      if (data === '[DONE]') continue;
      try {
        const j = JSON.parse(data);
        const d = j.choices?.[0]?.delta?.content || j.choices?.[0]?.delta?.reasoning_content || '';
        if (d) { full += d; onDelta?.(d); }
      } catch {}
    }
  }
  return full;
}

/** 把 AI 方案对象转成 Ribbon 结构 */
function planToRibbon(plan) {
  const ribbon = { startFromScratch: false, tabs: [], qat: [] };
  (plan.tabs || []).forEach((t, ti) => {
    const tab = { id: `tabAi${Date.now().toString(36)}${ti}`, label: t.label || `选项卡${ti + 1}`, groups: [] };
    (t.groups || []).forEach((g, gi) => {
      const group = { id: `grpAi${ti}_${gi}_${uidNum()}`, label: g.label || `分组${gi + 1}`, controls: [] };
      (g.controls || []).forEach(c => {
        const ctl = {
          type: c.type || 'button',
          id: `ctrlAi${uidNum()}`,
          label: c.label || '按钮',
          imageMso: c.imageMso || '',
          size: c.size === 'large' ? 'large' : 'normal',
          onAction: c.onAction || c.targetMacroModule + '.' + c.targetMacroName || '',
          onChange: c.onChange || '',
          screentip: c.screentip || '',
          supertip: c.supertip || '',
          visible: true, enabled: true,
        };
        if (ctl.type === 'menu') {
          ctl.items = (c.items || []).map(it => ({
            type: it.type || 'button', id: `ctrlAi${uidNum()}`,
            label: it.label || '项目', imageMso: it.imageMso || '',
            onAction: it.onAction || `${it.targetMacroModule || ''}.${it.targetMacroName || ''}`.replace(/^\./, ''),
            visible: true, enabled: true,
          }));
        }
        group.controls.push(ctl);
      });
      tab.groups.push(group);
    });
    ribbon.tabs.push(tab);
  });
  return ribbon;
}

function uidNum() { return (Date.now() % 100000).toString(36) + (_u++).toString(36) + Math.floor(Math.random() * 1000).toString(36); }

/* ============ 结构树 ============ */
function renderTree() {
  const root = $('#ribbon-tree');
  const q = state.filter.toLowerCase();
  let html = '';
  const matches = (label, id) => !q || (label || '').toLowerCase().includes(q) || (id || '').toLowerCase().includes(q);
  const isBound = c => c.onAction || c.onChange || (c.items || []).some(isBound);

  const controlHtml = (c, depth) => {
    if (state.bindFilter === 'bound' && !isBound(c)) return '';
    if (state.bindFilter === 'unbound' && isBound(c)) return '';
    const sel = state.selection?.controlId === c.id;
    const icon = iconFile(c.imageMso || ICON_ALIAS[c.imageMso] || c.imageMso);
    const icoHtml = c.type === 'separator' ? '<span class="ico-ph">—</span>'
      : (icon ? `<img class="ico" src="${icon}" onerror="this.style.display='none'" />` : '<span class="ico-ph">▫</span>');
    let children = '';
    if (c.items && c.items.length) {
      const key = 'c:' + c.id;
      const open = !state.collapsed.has(key);
      children = `<span class="twisty">${open ? '▾' : '▸'}</span>`;
      if (open) children += c.items.map(it => controlHtml(it, depth + 1)).join('');
    } else children = '<span class="twisty"></span>';
    return `<div class="tree-item depth-${depth} ${sel ? 'selected' : ''}" draggable="true" data-drag="1" data-ctype="control" data-id="${escapeHtml(c.id)}" title="${escapeHtml(c.label || c.type)} · 可拖动移动">
      ${children}${icoHtml}<span class="label">${escapeHtml(c.label || c.type)}</span>
      <span class="badge-mini">${c.type}</span>
      <span class="bind-dot ${isBound(c) ? 'bound' : 'unbound'}"></span>
    </div>`;
  };

  state.ribbon.tabs.forEach((tab, ti) => {
    if (!matches(tab.label, tab.id) && !tab.groups.some(g => matches(g.label, g.id) || g.controls.some(c => matches(c.label, c.id)))) return;
    const tsel = state.selection?.kind === 'tab' && state.selection.tabId === tab.id;
    const tkey = 't:' + tab.id;
    const open = !state.collapsed.has(tkey);
    let h = `<div class="tree-item depth-0 ${tsel ? 'selected' : ''}" draggable="true" data-drag="1" data-ctype="tab" data-id="${escapeHtml(tab.id)}" title="${escapeHtml(tab.label)} · 可拖动排序">
      <span class="twisty">${open ? '▾' : '▸'}</span><span class="ico-ph">📑</span>
      <span class="label">${escapeHtml(tab.label)}</span><span class="badge-mini">${tab.groups.length} 组</span></div>`;
    if (open) {
      tab.groups.forEach((g, gi) => {
        const gsel = state.selection?.kind === 'group' && state.selection.groupId === g.id;
        const gkey = 'g:' + g.id;
        const gopen = !state.collapsed.has(gkey);
        h += `<div class="tree-item depth-1 ${gsel ? 'selected' : ''}" draggable="true" data-drag="1" data-ctype="group" data-id="${escapeHtml(g.id)}" data-tab="${escapeHtml(tab.id)}" title="${escapeHtml(g.label)} · 可拖动移动">
          <span class="twisty">${gopen ? '▾' : '▸'}</span><span class="ico-ph">📁</span>
          <span class="label">${escapeHtml(g.label)}</span><span class="badge-mini">${g.controls.length}</span></div>`;
        if (gopen) h += g.controls.map(c => controlHtml(c, 2)).join('');
      });
    }
    html += h;
  });

  // QAT
  if (state.ribbon.qat?.length) {
    html += `<div class="tree-item depth-0" style="color:var(--text-3);cursor:default"><span class="ico-ph">⚡</span><span class="label">快速访问工具栏</span></div>`;
    html += state.ribbon.qat.map(c => controlHtml(c, 1)).join('');
  }
  root.innerHTML = html || '<div class="empty-hint">没有匹配的结构</div>';
}

function bindInspectorEvents(obj, sel) {
  const live = (id, fn) => { const el = $('#' + id); if (el) el.addEventListener('input', fn); };
  live('p-id', e => { obj.id = e.target.value; renderTree(); });
  live('p-label', e => { obj.label = e.target.value; renderTree(); renderPreview(); });
  live('p-imageMso', e => {
    obj.imageMso = e.target.value;
    const img = $('#p-icon-preview'); if (img) { img.src = iconFile(obj.imageMso); img.style.visibility = 'visible'; }
    renderTree(); renderPreview();
  });
  live('p-onAction', e => { obj.onAction = e.target.value; renderTree(); updateMacroBindings(); });
  live('p-onChange', e => { obj.onChange = e.target.value; renderTree(); });
  live('p-screentip', e => { obj.screentip = e.target.value; });
  live('p-supertip', e => { obj.supertip = e.target.value; });
  const size = $('#p-size'); if (size) size.addEventListener('change', e => { obj.size = e.target.value; renderPreview(); });
  const vis = $('#p-visible'); if (vis) vis.addEventListener('change', e => { obj.visible = e.target.checked; renderTree(); renderPreview(); });
  const en = $('#p-enabled'); if (en) en.addEventListener('change', e => { obj.enabled = e.target.checked; });
  const pick = $('#p-pick-icon'); if (pick) pick.addEventListener('click', () => openIconGallery(name => { obj.imageMso = name; renderInspector(); renderTree(); renderPreview(); }));
  const del = $('#p-delete'); if (del) del.addEventListener('click', () => deleteSelection());
  const addG = $('#p-add-group'); if (addG) addG.addEventListener('click', () => {
    const t = state.ribbon.tabs.find(t => t.id === sel.tabId);
    const g = newGroup('新分组'); t.groups.push(g);
    state.selection = { kind: 'group', tabId: t.id, groupId: g.id };
    renderAll();
  });
  const addC = $('#p-add-ctrl-btn'); if (addC) addC.addEventListener('click', () => {
    const t = state.ribbon.tabs.find(t => t.id === sel.tabId);
    const g = t.groups.find(g => g.id === sel.groupId);
    const type = $('#p-add-ctrl').value;
    const c = newControl(type, type === 'separator' ? '' : '新控件');
    g.controls.push(c);
    state.selection = { kind: 'control', tabId: t.id, groupId: g.id, controlId: c.id };
    renderAll();
  });
}

function updateMacroBindings() {
  const used = new Set();
  const collect = list => (list || []).forEach(c => {
    if (c.onAction) used.add(c.onAction);
    if (c.items) collect(c.items);
  });
  state.ribbon.tabs.forEach(t => t.groups.forEach(g => collect(g.controls)));
  (state.ribbon.qat || []).forEach(c => { if (c.onAction) used.add(c.onAction); });
  state.macros.forEach(m => {
    const full = `${m.module}.${m.name}`;
    m.bound = used.has(full) ? full : '';
  });
}

function deleteSelection() {
  const s = state.selection;
  if (!s) return;
  if (s.kind === 'tab') state.ribbon.tabs = state.ribbon.tabs.filter(t => t.id !== s.tabId);
  else if (s.kind === 'group') {
    const t = state.ribbon.tabs.find(t => t.id === s.tabId);
    if (t) t.groups = t.groups.filter(g => g.id !== s.groupId);
  } else {
    const f = findControl(state.ribbon, s.controlId);
    if (f) { f.siblings.splice(f.index, 1); }
  }
  state.selection = null;
  renderAll();
  toast('已删除', 'ok');
}

    h += `<div class="ai-msg assistant">我可以像设计 Agent 一样，根据当前导入文件里的宏，帮你规划清晰好用的 Ribbon 功能区。描述你的需求，或在下方选择要纳入的宏。</div>`;
  } else {
    state.aiMessages.forEach(m => { h += `<div class="ai-msg ${m.role}">${escapeHtml(m.content)}</div>`; });

async function sendAi() {

  const selected = [...state.aiSelectedMacros];
  const macros = selected.length ? state.macros.filter(m => selected.includes(`${m.module}.${m.name}`)) : state.macros;
  state.aiMessages.push({ role: 'user', content: text });
  input.value = '';
  renderAi();
  busy(true, 'AI 正在规划 Ribbon...');
  try {
    const imageMsos = listIconNames().slice(0, 200);
    const result = await planRibbon(state.aiSettings, text, macros, imageMsos, 'replace');

    state.ribbon = ribbon;
    state.activeTabIndex = 0;
    state.selection = null;
    state.aiMessages.push({ role: 'assistant', content: (result.summary || '已生成 Ribbon 方案') + '\n（已应用到设计画布，可继续微调）' });

}

function openIconGallery(onPick) {
  const names = getIconNames();
  const body = `
    <input id="icon-search" class="search-input" placeholder="搜索 imageMso 名称，例如 Bold / Font / Table" style="width:100%"/>
    <div id="icon-grid" class="icon-gallery"></div>`;
  openModal('选择 Office imageMso 图标', body, [], 'wide');

    const list = names.filter(n => !q || n.toLowerCase().includes(q.toLowerCase())).slice(0, 300);
    grid.innerHTML = list.map(n => `<div class="icon-cell" data-name="${escapeHtml(n)}">
      <img src="${iconFile(n)}" onerror="this.style.display='none'"/><span>${escapeHtml(n)}</span></div>`).join('')
      || '<div class="empty-hint">没有匹配图标</div>';

let _iconNameCache = null;
function getIconNames() {
  if (_iconNameCache) return _iconNameCache;
  const fromIcons = window.__ICON_NAMES__ || [];
  const fromIdmso = (window.__IDMSO__ || []).map(d => d.imageMso).filter(Boolean);
  _iconNameCache = [...new Set([...fromIcons, ...fromIdmso])]
    .filter(n => /^[A-Za-z][A-Za-z0-9_]*$/.test(n)).sort();
  return _iconNameCache;
}

async function doImport(file) {
  if (!file) return;
  busy(true, '正在检查工作簿...');
  try {
    const info = await inspectWorkbook(file);
    state.file = { name: info.name, originalBuffer: info.originalBuffer };
    state.macros = info.macros;
    if (info.ribbon && info.ribbon.tabs.length) {
      state.ribbon = info.ribbon;
    } else {
      state.ribbon = clone(WORKSPACES[state.ws].ribbon());
      // 用真实宏名重建示例绑定的提示

    state.ws = info.kind === 'word' ? 'word' : state.ws;
    $$('.ws-btn').forEach(b => b.classList.toggle('active', b.dataset.ws === state.ws));
    state.selection = null;
    state.activeTabIndex = 0;
    renderAll();

  } catch (e) {
    toast('导入失败：' + e.message, 'err');

async function doSaveWorkbook() {
  if (!state.file) { toast('请先导入工作簿文件', 'err'); return; }
  busy(true, '正在写入 Ribbon 并另存...');
  try {
    const xml = buildRibbonXml(state.ribbon);
    const isWord = state.file.name.toLowerCase().endsWith('.docm') || state.file.name.toLowerCase().endsWith('.dotm');
    const out = await injectRibbonIntoXlsm(state.file.originalBuffer, xml, {

  } catch (e) {
    toast('另存失败：' + e.message, 'err');
  } finally { busy(false); }
}

function doExportXml() {
  const xml = buildRibbonXml(state.ribbon);

/* ============ 结构树右键菜单 ============ */
function showTreeContextMenu(e, el) {
  e.preventDefault();
  const id = el.dataset.id;
  const kind = el.dataset.ctype;
  let menu = [
    { label: '✏️ 编辑属性', act: () => selectNode(el) },
  ];
  if (kind !== 'tab') menu.push({ label: '⧉ 复制', act: () => duplicateNode(id, kind) });
  menu.push({ sep: true });
  menu.push({ label: '↑ 上移', act: () => moveNode(id, -1) });
  menu.push({ label: '↓ 下移', act: () => moveNode(id, 1) });
  menu.push({ sep: true });
  menu.push({ label: '🗑 删除', danger: true, act: () => { selectNode(el); deleteSelection(); } });

  const existing = $('.ctx-menu'); if (existing) existing.remove();
  const m = document.createElement('div');
  m.className = 'ctx-menu';
  m.innerHTML = menu.map((it, i) => it.sep ? '<div class="sep"></div>' : `<button data-i="${i}" class="${it.danger ? 'danger' : ''}">${it.label}</button>`).join('');
  m.style.left = Math.min(e.clientX, window.innerWidth - 180) + 'px';
  m.style.top = Math.min(e.clientY, window.innerHeight - 240) + 'px';
  document.body.appendChild(m);
  m.addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return;
    const items = menu.filter(x => !x.sep);
    const idx = +b.dataset.i;
    // 重新映射（sep 不占按钮 index，但 data-i 用的是原始下标）
    const real = menu[idx];
    if (real && real.act) real.act();
    m.remove();
  });
  setTimeout(() => document.addEventListener('click', () => m.remove(), { once: true }), 0);
}

function selectNode(el) {
  const id = el.dataset.id, kind = el.dataset.ctype;
  if (kind === 'tab') state.selection = { kind: 'tab', tabId: id };
  else if (kind === 'group') state.selection = { kind: 'group', tabId: el.dataset.tab, groupId: id };
  else {
    const ti = state.ribbon.tabs.findIndex(t => t.groups.some(g => (g.controls || []).some(c => c.id === id) || (g.controls || []).some(c => (c.items||[]).some(i=>i.id===id))));
    if (ti >= 0) state.activeTabIndex = ti;
    state.selection = { kind: 'control', controlId: id };
  }
  state.inspectorMode = 'inspector';
  renderTree(); renderPreview(); renderBottom(); renderInspector();
  $$('.inspector-tab').forEach(b => b.classList.toggle('active', b.dataset.mode === 'inspector'));
  $('#inspector-content').hidden = false; $('#ai-content').hidden = true;
}

function duplicateNode(id, kind) {
  const f = findControl(state.ribbon, id);
  if (f) {
    const copy = clone(f.control);
    copy.id = uid(copy.type);
    (copy.items || []).forEach(it => it.id = uid(it.type));
    f.siblings.splice(f.index + 1, 0, copy);
    toast('已复制控件', 'ok');
  } else if (kind === 'group') {
    for (const t of state.ribbon.tabs) {
      const i = t.groups.findIndex(g => g.id === id);
      if (i >= 0) { const g = clone(t.groups[i]); g.id = uid('grp'); g.label += ' (副本)'; g.controls.forEach(c => c.id = uid(c.type)); t.groups.splice(i+1, 0, g); toast('已复制分组','ok'); break; }
    }
  }
  renderAll();
}

function moveNode(id, dir) {
  const f = findControl(state.ribbon, id);
  if (f) {
    const j = f.index + dir;
    if (j < 0 || j >= f.siblings.length) return;
    [f.siblings[f.index], f.siblings[j]] = [f.siblings[j], f.siblings[f.index]];
  } else {
    const tabs = state.ribbon.tabs;
    let ti = tabs.findIndex(t => t.id === id);
    if (ti >= 0) { const j = ti + dir; if (j < 0 || j >= tabs.length) return; [tabs[ti], tabs[j]] = [tabs[j], tabs[ti]]; }
    else for (const t of tabs) {
      const gi = t.groups.findIndex(g => g.id === id);
      if (gi >= 0) { const j = gi + dir; if (j < 0 || j >= t.groups.length) return; [t.groups[gi], t.groups[j]] = [t.groups[j], t.groups[gi]]; break; }
    }
  }
  renderAll();
}

/* ============ 拖放移动 ============ */
const dragCtx = { src: null, el: null, target: null, position: null };

/** 计算拖放目标位置：before / after / inside */
function calcDropPosition(el, src, dst, e) {
  const rect = el.getBoundingClientRect();
  // 树节点竖排 -> 用垂直方向；预览区 tab/控件横排 -> 用水平方向
  const inTree = !!el.closest('#ribbon-tree');
  const horizontal = !inTree && rect.width > rect.height * 1.2;
  let ratio = horizontal ? (e.clientX - rect.left) / rect.width : (e.clientY - rect.top) / rect.height;
  if (!isFinite(ratio) || (rect.width === 0 && rect.height === 0)) ratio = 0.5; // 兜底（如无布局环境）

  // 支持 inside 的目标：group（放控件/tab）、menu 控件（放控件）、tab（放分组）
  let allowInside = false;
  if (src.kind === 'control' && dst.kind === 'group') allowInside = true;
  if (src.kind === 'control' && dst.kind === 'control') {
    const c = findControl(state.ribbon, dst.id)?.control;
    if (c?.type === 'menu') allowInside = true;
  }
  if (src.kind === 'group' && dst.kind === 'tab') allowInside = true;

  if (allowInside) {
    // 中间 40% 区域 -> inside
    if (ratio > 0.3 && ratio < 0.7) return 'inside';
  }
  return ratio < 0.5 ? 'before' : 'after';
}

function clearDropHints() {
  $$('.drop-target, .drop-before, .drop-after').forEach(el => el.classList.remove('drop-target', 'drop-before', 'drop-after'));
}

function onDragStart(e) {
  const el = e.target.closest('[data-drag="1"]');
  if (!el || !el.dataset.id) return;
  // 预览菜单弹层里的子项也允许拖动
  dragCtx.src = { kind: el.dataset.ctype, id: el.dataset.id };
  dragCtx.el = el;
  el.classList.add('dragging');
  try {
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', el.dataset.id);
    e.dataTransfer.setDragImage(el, 14, 12);
  } catch {}
}

function onDragOver(e) {
  if (!dragCtx.src) return;
  const el = e.target.closest('[data-ctype][data-id]');
  if (!el || !el.dataset.id) return;
  const dst = { kind: el.dataset.ctype, id: el.dataset.id };
  if (!canDrop(dragCtx.src, dst)) return;
  e.preventDefault();
  try { e.dataTransfer.dropEffect = 'move'; } catch {}

  const position = calcDropPosition(el, dragCtx.src, dst, e);
  clearDropHints();
  if (position === 'inside') el.classList.add('drop-target');
  else el.classList.add(position === 'before' ? 'drop-before' : 'drop-after');
  dragCtx.target = dst;
  dragCtx.position = position;
}

function onDrop(e) {
  if (!dragCtx.src || !dragCtx.target) return;
  e.preventDefault();
  e.stopPropagation();
  const result = moveNodeTo(state.ribbon, dragCtx.src, dragCtx.target, dragCtx.position);
  if (result.ok) {
    // 若移动后选中的节点仍在，更新选择；否则清空
    renderAll();
    toast(result.message, 'ok');
  } else {
    toast(result.message, 'err');
  }
  cleanupDrag();
}

function cleanupDrag() {
  if (dragCtx.el) dragCtx.el.classList.remove('dragging');
  dragCtx.src = null; dragCtx.el = null; dragCtx.target = null; dragCtx.position = null;
  clearDropHints();
}

function bindDragAndDrop() {
  const tree = $('#ribbon-tree');
  const preview = $('#ribbon-preview');
  [tree, preview].forEach(root => {
    if (!root) return;
    root.addEventListener('dragstart', onDragStart);
    root.addEventListener('dragover', onDragOver);
    root.addEventListener('dragleave', e => {
      // 离开根节点时清除提示
      if (!root.contains(e.relatedTarget)) clearDropHints();
    });
    root.addEventListener('drop', onDrop);
  });
  document.addEventListener('dragend', cleanupDrag);
}

    state.macros = sampleMacros(state.ws);
    state.selection = null; state.activeTabIndex = 0;
    renderAll(); toast('已重置为示例设计', 'ok');
  });
  $('#btn-refresh').addEventListener('click', () => {
    updateMacroBindings(); renderAll(); toast('已刷新宏绑定信息', 'ok');
  });
  $('#btn-fill-icons').addEventListener('click', () => {
    const names = getIconNames();
    let n = 0;
    const fill = list => (list || []).forEach(c => {
      if (!c.imageMso && c.type !== 'separator' && c.type !== 'labelControl') {
        c.imageMso = names[Math.floor(Math.random() * Math.min(names.length, 150))] || 'Bold'; n++;
      }
      if (c.items) fill(c.items);
    });
    state.ribbon.tabs.forEach(t => t.groups.forEach(g => fill(g.controls)));
    renderAll(); toast(n ? `已补全 ${n} 个图标` : '没有需要补全的图标', n ? 'ok' : '');
  });
  $('#btn-add-tab').addEventListener('click', () => {
    const t = newTab('新选项卡'); state.ribbon.tabs.push(t);
    state.selection = { kind: 'tab', tabId: t.id };
    state.activeTabIndex = state.ribbon.tabs.length - 1;
    renderAll();
  });
  $('#btn-expand-all').addEventListener('click', () => { state.collapsed.clear(); renderTree(); });
  $('#btn-collapse-all').addEventListener('click', () => {
    state.collapsed.clear();
    state.ribbon.tabs.forEach(t => { state.collapsed.add('t:' + t.id); t.groups.forEach(g => state.collapsed.add('g:' + g.id)); });
    renderTree();
  });

  // 筛选
  $('#tree-filter').addEventListener('input', e => { state.filter = e.target.value; renderTree(); });
  $('#bind-filter').addEventListener('change', e => { state.bindFilter = e.target.value; renderTree(); });

  // 结构树点击 / 右键 / 展开折叠
  $('#ribbon-tree').addEventListener('click', e => {
    const item = e.target.closest('.tree-item'); if (!item) return;
    const tw = e.target.closest('.twisty');
    if (tw && item.querySelector('.twisty')) {
      const key = item.dataset.ctype === 'tab' ? 't:' + item.dataset.id
        : item.dataset.ctype === 'group' ? 'g:' + item.dataset.id : 'c:' + item.dataset.id;
      if (state.collapsed.has(key)) state.collapsed.delete(key); else state.collapsed.add(key);
      renderTree(); return;
    }
    selectNode(item);
  });
  $('#ribbon-tree').addEventListener('contextmenu', e => {
    const item = e.target.closest('.tree-item'); if (item) showTreeContextMenu(e, item);
  });

  // 预览点击
  $('#ribbon-preview').addEventListener('click', e => {
    const tabEl = e.target.closest('.office-tab[data-tab-index]');
    if (tabEl) { state.activeTabIndex = +tabEl.dataset.tabIndex; renderPreview(); return; }
    const ctrl = e.target.closest('.office-ctrl[data-id]');
    if (ctrl) {
      if (ctrl.classList.contains('office-menu')) {
        const pop = ctrl.querySelector('.menu-popover');
        if (pop) pop.hidden = !pop.hidden;
      }
      selectNode({ dataset: { id: ctrl.dataset.id, ctype: 'control' } });
    }
  });

  // 底部标签
  $$('.bottom-tab').forEach(b => b.addEventListener('click', () => { state.bottomTab = b.dataset.tab; renderBottom(); }));
  $('#btn-copy-xml').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(buildRibbonXml(state.ribbon)); toast('已复制 XML 到剪贴板', 'ok'); }
    catch { toast('复制失败，请手动选择', 'err'); }
  });

  // 属性 / AI 切换
  $$('.inspector-tab').forEach(b => b.addEventListener('click', () => {
    state.inspectorMode = b.dataset.mode;
    $$('.inspector-tab').forEach(x => x.classList.toggle('active', x === b));
    $('#inspector-content').hidden = state.inspectorMode !== 'inspector';
    $('#ai-content').hidden = state.inspectorMode !== 'ai';
    if (state.inspectorMode === 'ai') renderAi();
  }));

  // 拖拽导入（仅当拖入的是文件时；内部节点拖放已由 bindDragAndDrop 处理）
  window.addEventListener('dragover', e => { e.preventDefault(); });
  window.addEventListener('drop', e => {
    e.preventDefault();
    const f = e.dataTransfer.files?.[0];
    if (f && /\.(xlsm|xlam|docm|dotm)$/i.test(f.name)) doImport(f);
    else if (!dragCtx.src && f) toast('请拖入 .xlsm / .xlam / .docm 文件', 'err');
  });

  // 分栏拖拽
  $$('.splitter').forEach(sp => sp.addEventListener('mousedown', e => {
    e.preventDefault();
    const left = sp.dataset.split === 'left';
    const panel = left ? $('.tree-panel') : $('.inspector-panel');
    const startX = e.clientX, startW = panel.offsetWidth;
    const move = ev => {
      const dx = ev.clientX - startX;
      const w = left ? startW + dx : startW - dx;
      panel.style.width = Math.max(180, Math.min(520, w)) + 'px';
    };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  }));

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); const m = $('.ctx-menu'); if (m) m.remove(); }
  });
}

init();

})();

} catch (e) { console.error(e); document.body.innerHTML = "<pre style=\"color:red;padding:20px\">启动失败: " + e.message + "</pre>"; }
</script>
</body>
</html>
